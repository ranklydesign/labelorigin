<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | LabelOrigin</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px;">
    <div style="max-width: 520px; background: var(--bg-card); border: 1px solid var(--border-card); padding: 48px 36px; border-radius: var(--radius-lg); box-shadow: var(--shadow-cyan);">
        <span class="badge" style="color: var(--neon-amber); border-color: rgba(255, 183, 3, 0.4); background: rgba(255, 183, 3, 0.08);">404 &bull; Facility Not Found</span>
        <h1 style="font-size: 2.4rem; margin: 18px 0 12px; font-weight: 900;">Route Does Not Exist</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 28px;">
            The requested directory slug or facility channel could not be found or has been migrated.
        </p>
        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a href="./" class="btn">Return to Marketplace Directory &rarr;</a>
            <a href="./renaud/" class="btn btn-green">Visit Renaud Skincare Portal</a>
        </div>
    </div>
