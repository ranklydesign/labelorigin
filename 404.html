<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <title>Route Not Found | LabelOrigin</title>
    <meta name="robots" content="noindex">
    <script src="/assets/js/theme.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px;">
    <div style="max-width: 540px; background: var(--bg-surface); border: 1px solid var(--line-light); padding: 56px 40px; border-radius: var(--radius-sm); box-shadow: var(--shadow-ambient);">
        <span class="editorial-eyebrow">Error 404 &bull; Page Not Found</span>
        <h1 style="font-family: var(--font-serif); font-size: 2.8rem; margin: 16px 0 14px; font-weight: 300; color: var(--ivory-white);">This page doesn't exist</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 32px; font-weight: 300; line-height: 1.65;">
            We couldn't find that page. It may have moved, or the link may be mistyped.
        </p>
        <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="btn btn-secondary">LabelOrigin Home &rarr;</a>
            <a href="/renaud/" class="btn btn-primary">Renaud Naturals Funnel</a>
        </div>
    </div>
</body>
</html>
